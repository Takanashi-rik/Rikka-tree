<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 𝙍𝙞𝙠𝙠𝙖𝙒𝙖𝙣𝙜𝙮𝙮 | Modern Linktree</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="hero">
        <img src="" alt="Background" id="bgImage">
        <div class="hero-overlay"></div>
    </div>

    <div class="container">
        <div class="profile">
            <h1 id="profileName">Loading...</h1>
            <p id="profileBio"></p>
        </div>

        <div class="social-icons" id="socialIcons"></div>

        <div class="links" id="linksContainer"></div>

        <!-- MUSIC PLAYER -->
        <div class="music-player" id="musicPlayer">
            <div class="music-header">
                <img src="" alt="Album Art" class="album-art" id="albumArt">
                <div class="music-info">
                    <div class="song-title" id="songTitle">Song Title</div>
                    <div class="artist" id="artist">Artist Name</div>
                </div>
                <button class="play-pause" id="playPauseBtn">
                    <i class="fas fa-play" id="playPauseIcon"></i>
                </button>
            </div>
            <div class="music-controls">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
            <div class="lyrics-container" id="lyricsContainer">
                <div class="lyrics" id="lyrics"></div>
            </div>
        </div>

        <div class="footer">
            <p>Inspirated by <a href="https://linktr.ee/sorawangyy" target="_blank">linktr.ee/sorawangyy</a> created by <a href="#" target="_blank">@aditya</a></p>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>
    <script src="script.js"></script>
</body>
</html>
